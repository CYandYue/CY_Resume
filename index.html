<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>常越 | 中文简历</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1d252d;
        --muted: #5d6873;
        --line: #d9dee4;
        --accent: #1f4e79;
        --paper: #f7f8fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      header {
        max-width: 1120px;
        margin: 0 auto;
        padding: 18px 22px 14px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.25;
        font-weight: 700;
      }

      .meta {
        margin-top: 4px;
        color: var(--muted);
        font-size: 14px;
      }

      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 18px 22px 24px;
      }

      .viewer {
        width: 100%;
        height: calc(100vh - 118px);
        min-height: 680px;
        border: 1px solid var(--line);
        background: #fff;
      }

      .fallback {
        padding: 24px;
        color: var(--muted);
      }

      @media (max-width: 720px) {
        header {
          padding: 16px;
        }

        main {
          padding: 12px 16px 18px;
        }

        h1 {
          font-size: 22px;
        }
        .viewer {
          height: calc(100vh - 132px);
          min-height: 560px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>常越 | 中文简历</h1>
        <div class="meta">更新日期：__UPDATED_AT__</div>
      </div>
    </header>
    <main>
      <object class="viewer" data="resume.pdf" type="application/pdf">
        <div class="fallback">
          当前浏览器无法内嵌显示 PDF，请打开 <a href="resume.pdf">resume.pdf</a>。
        </div>
      </object>
    </main>
  </body>
</html>
