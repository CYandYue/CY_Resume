name: Build and Deploy Resume

on:
  push:
    branches:
      - master
    paths:
      - resume_byte_cn.tex
      - changyue.jpg
      - fonts/**
      - fontawesome.sty
      - fontawesomesymbols-*.tex
      - index.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build resume PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: resume_byte_cn.tex
          latexmk_use_xelatex: true
          args: -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp resume_byte_cn.tex _site/resume_byte_cn.tex
          cp resume_byte_cn.pdf _site/resume_byte_cn.pdf
          cp resume_byte_cn.pdf _site/resume.pdf
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
